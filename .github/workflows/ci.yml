name: CI / Post-Quantum CBOM Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    name: Test FastAPI Backend & End-to-End Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Start Backend in Background
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4

      - name: Run End-to-End Verification Tests
        run: |
          cd backend
          python test_e2e.py

  build-frontend:
    name: Build React + Vite Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend Bundle
        run: |
          cd frontend
          npm run build
